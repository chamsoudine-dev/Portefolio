<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anatec Git Trainer — Entraîneur Git du Débutant à Super Expert</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{
  --bg:#070a0f;--panel:#0d1219;--p2:#131c2a;--text:#e8eefc;--muted:#8fa3b5;
  --gold:#dcb96e;--cyan:#00e5ff;--green:#00ff9d;--blue:#4ea1ff;--red:#ff5f5f;--amber:#ffc45d;
  --line:#1a2533;--font-mono:"DejaVu Sans Mono",Consolas,ui-monospace,monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 var(--font-sans)}

/* Header Anatec */
header{
  background:#090d13;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;z-index:20;flex-wrap:wrap;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand img{width:32px;height:32px;filter:drop-shadow(0 0 8px rgba(220,185,110,0.4));border-radius:6px}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-title{font-size:16px;font-weight:800;letter-spacing:0.04em}
.brand-title b{color:var(--gold)}
.brand-sub{font-size:9.5px;color:var(--cyan);font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase}
.nav-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn-nav{
  background:#101822;color:var(--text);border:1px solid var(--line);
  padding:6px 12px;border-radius:6px;font-size:12px;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;transition:.2s;
}
.btn-nav:hover{border-color:var(--cyan);color:#fff}
.badge-live{background:rgba(0,229,255,0.1);color:var(--cyan);border:1px solid rgba(0,229,255,0.3);padding:3px 8px;border-radius:4px;font-size:11px}

main{max-width:1240px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:16.5px;margin:0 0 8px;color:#fff}
.lv{width:100%;text-align:left;background:var(--p2);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:8px;margin:4px 0;cursor:pointer;font:inherit;transition:.15s}
.lv:hover{border-color:var(--cyan)}
.lv.on{border-color:var(--green);box-shadow:inset 3px 0 var(--green);background:rgba(0,255,157,0.05)}
.lv small{display:block;color:var(--muted);font-size:11.5px}
.lv.max{border-color:var(--amber)}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.rank{font-weight:700;color:var(--amber);font-size:13.5px}
.task{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.task b{color:var(--green)}
code{font-family:var(--font-mono);color:var(--cyan);background:#070a0e;padding:2px 6px;border-radius:4px}
.term{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#070b12;color:#cbd7ee}
.th{padding:8px 12px;background:#0d1420;display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-family:var(--font-mono)}
#out{height:300px;overflow:auto;padding:12px;font:13px/1.6 var(--font-mono);white-space:pre-wrap}
#out .ok{color:var(--green)}#out .err{color:var(--red)}#out .info{color:var(--cyan)}#out .add{color:var(--green)}#out .del{color:var(--red)}
.ir{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 10px;font:13px var(--font-mono);color:var(--green);background:#0a0f18}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#f3f7ff;font:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--p2);color:var(--text);padding:8px 13px;font:inherit;font-size:12.5px;transition:.15s}
button:hover{border-color:var(--cyan);color:#fff}
button.p{background:var(--green);border-color:var(--green);color:#06150f;font-weight:700}
button.p:hover{filter:brightness(1.15)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:12.5px;color:var(--amber);margin:8px 0 0;min-height:1em}
#g{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--p2)}
#g text{fill:var(--text);font:11px var(--font-mono)}
.done{color:var(--green);font-weight:700}
@media(max-width:880px){main{grid-template-columns:1fr}#out{height:250px}}
</style>
</head>
<body>

<header>
  <a class="brand" href="/">
    <img src="/favicon.svg" alt="Logo Anatec">
    <div class="brand-text">
      <span class="brand-title">ANA<b>TEC</b></span>
      <span class="brand-sub">GIT TERMINAL TRAINER</span>
    </div>
  </a>
  <div class="nav-actions">
    <span class="badge-live">● MOTEUR GIT CLIENT-SIDE 100% ISOLÉ</span>
    <a class="btn-nav" href="/hackerlab.html">🛡️ HackerLab</a>
    <a class="btn-nav" href="/cours.html">📚 Cours</a>
    <a class="btn-nav" href="/simulator.html">⚡ Simulateur OS</a>
    <a class="btn-nav" href="/">🏠 Accueil</a>
  </div>
</header>

<main>
  <aside class="card">
    <h2>Parcours d'Apprentissage</h2>
    <div class="rank" id="rank">Rang : Novice</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="muted" style="font-size:12px;margin-bottom:12px" id="pct">0 / 40 missions · 0 %</div>
    <div id="lvs"></div>
    <div class="act" style="margin-top:14px">
      <button onclick="resetAll()" style="font-size:11px;padding:6px 10px;background:#1a1114;border-color:#4a2028;color:#ff7c8a">Tout réinitialiser</button>
    </div>
  </aside>

  <section class="card">
    <h2 id="ttl">Chargement de la mission…</h2>
    <div class="task">
      <div id="desc"></div>
      <p class="hint" id="hint"></p>
    </div>

    <div class="term">
      <div class="th"><span>user@anatec-sandbox: ~/projet</span><span id="brn"></span></div>
      <div id="out" aria-live="polite"></div>
      <div class="ir">
        <span id="ps">$</span>
        <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="git status, git add ., git commit -m &quot;...&quot;, git help…">
      </div>
    </div>

    <div class="act">
      <button class="p" onclick="run()">▶ Exécuter</button>
      <button onclick="hint()">💡 Indice</button>
      <button onclick="load()">🔄 Recommencer la mission</button>
      <button class="p" id="nx" onclick="next()">Mission Suivante →</button>
    </div>

    <div class="muted" style="margin-top:12px;font-size:12.5px" id="st"></div>
    <div id="g"></div>
  </section>
</main>

{t:'Squash',d:'Fusionne C et D en un seul commit (B reste à part). Lance <code>git rebase -i HEAD~3</code>, puis édite le plan : <code>squash 3</code>, et <code>go</code> pour exécuter.',h:'git rebase -i HEAD~3 · squash 3 · go',s:[...R,...K('D')],ok:()=>hist(cid()).length===3&&ms().includes('C')&&!ms().includes('D')&&ht()['d.txt']!==undefined},
{t:'Supprimer un commit',d:'Le commit C est une erreur. Retire-le de l’historique en gardant B et D.',h:'git rebase -i HEAD~3 · drop 2 · go',s:[...R,...K('D')],ok:()=>hist(cid()).length===3&&!ms().includes('C')&&ht()['c.txt']===undefined&&ht()['d.txt']!==undefined},
{t:'Renommer un commit',d:'Le message du commit B est « bad ». Renomme-le en « Ajoute B » (<code>reword 1 "Ajoute B"</code>).',h:'git rebase -i HEAD~2 · reword 1 "Ajoute B" · go',s:[...A,...K('bad','b.txt'),...K('C')],ok:()=>ms().includes('Ajoute B')&&!ms().includes('bad')&&hist(cid()).length===3},
{t:'Nettoyage complet',d:'Transforme wip1, oops et wip2 en un unique commit « Feature » qui garde tous leurs fichiers.',h:'git rebase -i HEAD~3 · squash 2 · squash 3 · reword 1 "Feature" · go',s:[...A,...K('wip1'),...K('oops'),...K('wip2')],ok:()=>hist(cid()).length===2&&S.C[cid()].msg==='Feature'&&ht()['wip1.txt']!==undefined&&ht()['oops.txt']!==undefined&&ht()['wip2.txt']!==undefined},
{t:'Conflit en plein rebase',d:'Rebase <b>feature</b> sur main : a.txt est en conflit. Résous-le (garde « final »), puis termine le rebase. L’historique final doit être linéaire.',h:'git rebase main · echo final > a.txt · git add a.txt · git rebase --continue',s:[...CF,'git switch feature'],ok:()=>S.head==='feature'&&!S.rq&&S.C[S.B.feature].p[0]===S.B.main&&ht()['a.txt']==='final'},
{t:'Abandonner proprement',d:'Même situation, mais la résolution est trop risquée. Lance le rebase, puis abandonne et vérifie que feature est revenue intacte.',h:'git rebase main · git rebase --abort',s:[...CF,'git switch feature'],ok:()=>S.f.ab&&!S.rq&&S.head==='feature'&&S.C[S.B.feature].p[0]!==S.B.main}]},
{n:'Super expert',s:'Défis réels, sans filet',m:[
{t:'Sauvetage',d:'La branche <b>feature</b> (commit « precious ») vient d’être supprimée de force. Recrée-la sous le nom <b>rescue</b>.',h:'Le reflog garde les ids : git branch rescue <id>',s:[...A,'git switch -c feature',...K('precious'),'git switch main','git branch -D feature'],ok:()=>S.B.rescue&&S.C[S.B.rescue].msg==='precious'},
{t:'Historique propre',d:'Objectif : main = A, M, puis <i>un seul</i> commit « Feature » contenant wip1 et wip2. Historique linéaire, sans commit de merge.',h:'rebase → squash → fast-forward',s:[...A,'git switch -c feature',...K('wip1'),...K('wip2'),'git switch main',...K('M'),'git switch feature'],ok:()=>{let b=S.B.main,t=T(b);return hist(b).length===3&&S.C[b].msg==='Feature'&&S.C[b].p.length===1&&t['wip1.txt']!==undefined&&t['wip2.txt']!==undefined&&t['m.txt']!==undefined}},
{t:'Hotfix à chaud',d:'Tu codes sur feature (modif non commitée sur f.txt). Fais un commit « hotfix » sur main, puis reviens sur feature avec ton brouillon intact.',h:'stash → switch → commit → switch → pop',s:[...A,'git switch -c feature',...K('F'),'echo brouillon >> f.txt'],ok:()=>S.head==='feature'&&(S.wt['f.txt']||'').includes('brouillon')&&S.C[S.B.main].msg==='hotfix'&&!S.stash.length},
{t:'Release',d:'Fusionne feature dans main (conflit sur a.txt : garde « final »), puis pose le tag <b>v2.0</b> sur le résultat.',h:'merge · résoudre · add · commit · tag v2.0',s:CF,ok:()=>S.tags['v2.0']&&S.tags['v2.0']===cid()&&S.C[cid()].p.length===2&&ht()['a.txt']==='final'}]}
];

const $=i=>document.getElementById(i),key=()=>li+'-'+mi,M=()=>L[li].m[mi],tot=()=>L.reduce((n,l)=>n+l.m.length,0);
const RK=['Novice','Apprenti','Contributeur','Mainteneur','Architecte','Maître Git','Expert Git','Équipier senior','Gardien de la sécurité','Chirurgien de l’historique','Super expert Git'];

function write(t,c=''){let o=$('out');String(t).split('\n').forEach(l=>{let d=document.createElement('div'),k=c;if(c==='diff')k=l[0]==='+'?'add':l[0]==='-'?'del':l.startsWith('diff')?'info':'';d.className=k;d.textContent=l||' ';o.appendChild(d)});o.scrollTop=o.scrollHeight}
function save(){try{localStorage.setItem('anatec_gtt',JSON.stringify([...done]))}catch(e){}}
function side(){let full=L.filter((l,i)=>l.m.every((_,j)=>done.has(i+'-'+j))).length,p=Math.round(done.size/tot()*100);$('rank').textContent='Rang : '+RK[full];$('bar').style.width=p+'%';$('pct').textContent=`${done.size} / ${tot()} missions · ${p} %`;
$('lvs').innerHTML=L.map((l,i)=>{let n=l.m.filter((_,j)=>done.has(i+'-'+j)).length;return`<button class="lv ${i===li?'on':''} ${i===L.length-1?'max':''}" onclick="pick(${i})">Niveau ${i+1} · ${l.n}<small>${l.s} — ${n}/${l.m.length}</small></button>`}).join('')}
function load(){S=fresh();let m=M();m.s.forEach(c=>exec(c));S.f={};$('out').innerHTML='';hs=0;$('hint').textContent='';$('ttl').textContent=`Niveau ${li+1} · ${L[li].n} — Mission ${mi+1}/${L[li].m.length} : ${m.t}`;$('desc').innerHTML=m.d;
write(m.s.length?'Dépôt de départ prêt. Tape git status ou git log --oneline pour t’orienter.':'Dossier vide. Tape help pour la liste des commandes.','info');upd();side();$('cmd').focus()}
function upd(){$('brn').textContent=(S.repo?(S.det?'HEAD détaché':S.head):'pas de dépôt')+(S.rb||S.rq?' · rebase en cours':'');$('ps').textContent=`user@projet${S.repo?' ('+(S.det?'détaché':S.head)+')':''}:~$`;let d=done.has(key());$('st').innerHTML=d?'<span class="done">✓ Mission validée</span>':'Mission en cours';graph()}
function graph(){let g=$('g'),ids=Object.keys(S.C).sort((a,b)=>S.C[a].n-S.C[b].n);if(!ids.length){g.innerHTML='<span class="muted">Le graphe des commits apparaît ici dès le premier commit.</span>';return}
let nm=Object.keys(S.B).sort((a,b)=>(b==='main')-(a==='main')),ln={},co=['#5ee6a8','#75a7ff','#ffc45d','#ff7c8a','#c79bff'],X={},Y={};
ids.forEach((id,i)=>{let k=nm.findIndex(b=>anc(S.B[b]).has(id));ln[id]=k<0?nm.length:k;X[id]=24+i*54;Y[id]=40+ln[id]*38});
let w=ids.length*54+60,h=Math.max(...Object.values(Y))+34,s=`<svg width="${w}" height="${h}" role="img" aria-label="Graphe des commits">`;
ids.forEach(id=>S.C[id].p.forEach(p=>s+=`<line x1="${X[p]}" y1="${Y[p]}" x2="${X[id]}" y2="${Y[id]}" stroke="${co[ln[id]%5]}" stroke-width="2.5"/>`));
ids.forEach(id=>{let r=Object.keys(S.B).filter(b=>S.B[b]===id).map(b=>b).concat(Object.keys(S.tags).filter(t=>S.tags[t]===id).map(t=>'🏷'+t));if(id===cid())r.unshift('HEAD');
s+=`<circle cx="${X[id]}" cy="${Y[id]}" r="8" fill="${co[ln[id]%5]}" stroke="${id===cid()?'#fff':'none'}" stroke-width="3"/><text x="${X[id]}" y="${Y[id]+24}" text-anchor="middle">${id.slice(0,4)}</text>`;if(r.length)s+=`<text x="${X[id]}" y="${Y[id]-14}" text-anchor="middle" style="font-weight:700">${r.join(' ')}</text>`});g.innerHTML=s+'</svg>'}
function run(){let i=$('cmd'),raw=i.value.trim();if(!raw)return;H.push(raw);hi=H.length;i.value='';write((S.repo?'':'')+'$ '+raw);
if(raw==='clear'){$('out').innerHTML='';return}
exec(raw).forEach(r=>write(r[0],r[1]));upd();if(!done.has(key())&&M().ok()){done.add(key());save();write('✓ Mission validée ! Passe à la suivante.','ok');upd();side()}}
function hint(){hs=1;$('hint').textContent='Indice : '+M().h}
function pick(i){li=i;mi=0;load()}
function next(){if(mi<L[li].m.length-1)mi++;else if(li<L.length-1){li++;mi=0}else{li=0;mi=0}load()}
function resetAll(){if(confirm('Réinitialiser toute votre progression Git Trainer ?')){done.clear();save();li=0;mi=0;load()}}
$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')run();else if(e.key==='ArrowUp'&&H.length){hi=Math.max(0,hi-1);e.target.value=H[hi]||'';e.preventDefault()}else if(e.key==='ArrowDown'){hi=Math.min(H.length,hi+1);e.target.value=H[hi]||''}});
try{done=new Set(JSON.parse(localStorage.getItem('anatec_gtt')||'[]'))}catch(e){}
load();
</script>
</body>
