<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="40%" stop-color="#dcb96e"/>
      <stop offset="100%" stop-color="#9a7428"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond sombre arrondi -->
  <rect width="100" height="100" rx="22" fill="#06090f"/>
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Bouclier Hexagonal de protection -->
  <polygon points="50,12 85,26 85,62 50,88 15,62 15,26" fill="rgba(14,21,32,0.9)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Lignes de circuit interne Cyan -->
  <path d="M 50,18 L 78,30 L 78,58 L 50,80 L 22,58 L 22,30 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="1.2" opacity="0.5"/>

  <!-- Lettre stylisée A (ANATEC) -->
  <!-- Montants du A -->
  <path d="M 50,22 L 72,70 L 61,70 L 50,44 L 39,70 L 28,70 Z" fill="url(#goldGrad)"/>

  <!-- Barre transversale technologique du A -->
  <rect x="36" y="52" width="28" height="4.5" rx="2" fill="url(#cyanGrad)" filter="url(#glow)"/>

  <!-- Cœur cybernétique lumineux -->
  <circle cx="50" cy="54" r="3.5" fill="#ffffff" filter="url(#glow)"/>
</svg>