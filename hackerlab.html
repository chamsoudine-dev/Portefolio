<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anatec HackerLab — Académie de Cybersécurité & Pentest</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{
  --bg:#070a0f;--panel:#0d1219;--p2:#101822;--text:#c7d0d9;--muted:#7f93a5;
  --gold:#dcb96e;--cyan:#00e5ff;--green:#00ff9d;--blue:#4ea1ff;--red:#ff5f5f;
  --line:#1a2533;--font-mono:"DejaVu Sans Mono",Consolas,ui-monospace,monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);
  display:grid;grid-template-rows:56px 1fr;height:100vh;overflow:hidden;
}

/* Header Anatec */
header{
  background:#090d13;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:20;font-family:var(--font-sans);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand img{width:32px;height:32px;filter:drop-shadow(0 0 8px rgba(220,185,110,0.4));border-radius:6px}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-title{font-size:16px;font-weight:800;letter-spacing:0.04em}
.brand-title b{color:var(--gold)}
.brand-sub{font-size:9.5px;color:var(--cyan);font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase}
.nav-actions{display:flex;align-items:center;gap:10px}
.btn-nav{
  background:#101822;color:var(--text);border:1px solid var(--line);
  padding:6px 12px;border-radius:6px;font-size:12px;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;transition:.2s;
}
.btn-nav:hover{border-color:var(--cyan);color:#fff}
.badge-live{background:rgba(0,255,157,0.1);color:var(--green);border:1px solid rgba(0,255,157,0.3);padding:3px 8px;border-radius:4px;font-size:11px}

/* Conteneur principal */
.app-container{
  display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 56px);overflow:hidden;
}
aside{background:#070a0e;border-right:1px solid var(--line);padding:12px;overflow-y:auto}
aside h1{font-size:13.5px;color:var(--green);margin:0 0 10px;display:flex;align-items:center;gap:6px}
.tab{
  display:block;width:100%;text-align:left;background:#101820;color:#8fa3b5;
  border:1px solid #1e2a36;padding:8px 10px;margin-bottom:6px;border-radius:6px;
  cursor:pointer;font-family:inherit;font-size:11px;transition:.15s;
}
.tab:hover:not(.locked){border-color:var(--cyan);color:#fff}
.tab.active{border-color:var(--green);color:var(--green);background:rgba(0,255,157,0.06)}
.tab.done{color:#5ddc9a}
.tab.locked{opacity:.4;cursor:not-allowed}
.tab.red{border-left:3px solid var(--red)}
.tab.blue{border-left:3px solid var(--blue)}
.tab.green{border-left:3px solid var(--green)}
.foot{margin-top:14px;font-size:10.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}

main{display:flex;flex-direction:column;overflow:hidden}
#brief{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#brief h2{margin:0 0 4px;font-size:13.5px;color:var(--blue)}
#brief p{margin:0;font-size:11.5px;color:var(--muted);white-space:pre-line;line-height:1.5}

#layout{flex:1;display:grid;grid-template-columns:1fr 310px;overflow:hidden}
#content{overflow-y:auto;padding:16px 20px;font-size:12.5px;line-height:1.6}
#content h3{color:var(--green);margin-top:0}
#content code{background:#101820;padding:2px 6px;border-radius:4px;color:#ffd479;font-size:11.5px}
#content pre{background:#070a0e;border:1px solid var(--line);padding:10px;border-radius:6px;overflow-x:auto;font-size:11.5px;color:#9fe8c1}
.quiz{background:var(--panel);border:1px solid #1a2c3a;border-radius:8px;padding:12px;margin:14px 0}
.quiz b{color:var(--blue)}
button.quiz-btn{background:var(--green);color:#000;border:none;padding:7px 12px;margin:6px 6px 0 0;cursor:pointer;font-family:inherit;border-radius:4px;font-size:11px;font-weight:700}
button.quiz-btn:hover{filter:brightness(1.15)}

#side{background:#070a0e;border-left:1px solid var(--line);padding:12px;overflow-y:auto;font-size:11.5px}
#side h3{margin:0 0 8px;color:var(--blue);font-size:12px}
#agentLog{color:var(--muted);margin-top:6px;max-height:260px;overflow-y:auto;line-height:1.45}
#term{display:flex;flex-direction:column;overflow:hidden;background:#080c12}
#out{flex:1;overflow-y:auto;padding:12px 14px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
#line{display:flex;padding:8px 14px;border-top:1px solid var(--line);background:#070a0e}
#prompt{color:var(--green);white-space:nowrap;margin-right:6px}
#cmd{flex:1;background:transparent;border:none;outline:none;color:#e8eef5;font-family:inherit;font-size:12.5px}

.ok{color:var(--green)}.warn{color:#ffcc00}.err{color:var(--red)}.info{color:var(--blue)}.dim{color:#5a6b7c}.hd{color:var(--blue);font-weight:bold}
.hidden{display:none!important}

@media(max-width:960px){
  .app-container{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:calc(100vh - 56px)}
  aside{max-height:140px;border-right:none;border-bottom:1px solid var(--line)}
  #layout{grid-template-columns:1fr}
  #side{display:none}
}
</style>
</head>

const courses=[
{id:"c1",name:"C1 · Bases du réseau",html:`
<h3>Le réseau en 10 minutes</h3>
<p>Une <b>adresse IP</b> identifie une machine (ex : <code>10.10.10.5</code>). Les <b>ports</b> identifient les services : 22 = SSH, 80 = HTTP, 443 = HTTPS, 21 = FTP, 445 = SMB, 3306 = MySQL, 23 = Telnet.</p>
<pre>nmap -sV 10.10.10.5      # liste les services + versions
ping 10.10.10.5          # la machine répond-elle ?</pre>
<p><b>À retenir :</b> chaque port ouvert est une porte d'entrée potentielle. Moins de services = moins de risques.</p>
<div class="quiz"><b>Quiz :</b> quel port correspond à SSH ?<br>
<button class="quiz-btn" onclick="quiz(this,0,1)">a) 80</button><button class="quiz-btn" onclick="quiz(this,0,2)">b) 22</button><button class="quiz-btn" onclick="quiz(this,0,3)">c) 445</button></div>`},
{id:"c2",name:"C2 · Linux & terminal Kali",html:`
<h3>Survivre dans un terminal</h3>
<pre>ls                # lister les fichiers
cd /home/kali     # changer de dossier
cat fichier.txt   # lire un fichier
whoami            # qui suis-je ?</pre>
<p>Kali Linux est une distribution dédiée au pentest : nmap, hydra, john, sqlmap, metasploit y sont préinstallés. Le dossier <code>/usr/share/wordlists/rockyou.txt</code> contient 14 millions de mots de passe fuités — l'arme favorite des attaques par dictionnaire.</p>
<div class="quiz"><b>Quiz :</b> quelle commande lit un fichier ?<br>
<button class="quiz-btn" onclick="quiz(this,1,1)">a) ls</button><button class="quiz-btn" onclick="quiz(this,1,2)">b) cat</button><button class="quiz-btn" onclick="quiz(this,1,3)">c) cd</button></div>`},
{id:"c3",name:"C3 · Sécurité web",html:`
<h3>Le web vu par un attaquant</h3>
<p>Un serveur web sert des pages. Certaines sont cachées : <code>/robots.txt</code> (parfois trahi par le développeur !), dossiers <code>/backup</code>, <code>/admin</code>. Les outils d'énumération les cherchent avec un dictionnaire :</p>
<pre>gobuster dir -u http://cible -w /usr/share/wordlists/dirb/common.txt
curl http://cible/robots.txt</pre>
<p><b>Injection SQL :</b> si une page construit sa requête avec l'entrée utilisateur (<code>?id=1</code>), l'attaquant peut la détourner pour lire toute la base. L'outil sqlmap automatise l'extraction.</p>
<div class="quiz"><b>Quiz :</b> où un développeur oublie-t-il souvent des chemins secrets ?<br>
<button class="quiz-btn" onclick="quiz(this,2,1)">a) robots.txt</button><button class="quiz-btn" onclick="quiz(this,2,2)">b) index.css</button><button class="quiz-btn" onclick="quiz(this,2,3)">c) favicon.ico</button></div>`},
{id:"c4",name:"C4 · Mots de passe & hash",html:`
<h3>Stocker et casser des mots de passe</h3>
<p>Un système ne stocke jamais ton mot de passe : il stocke son <b>hash</b> (empreinte mathématique irréversible). Mais si le hash fuite, on peut tester des millions de candidats :</p>
<pre>john --wordlist=/usr/share/wordlists/rockyou.txt hash.txt</pre>
<p><b>Règle d'or :</b> la longueur bat la complexité. <code>soleil22</code> tombe en secondes ; une phrase de 20 mots prendrait des milliards d'années.</p>
<div class="quiz"><b>Quiz :</b> qu'est-ce qui protège le mieux ?<br>
<button class="quiz-btn" onclick="quiz(this,3,1)">a) P@ss (complexe, court)</button><button class="quiz-btn" onclick="quiz(this,3,2)">b) mon-chat-aime-le-thon-fraichement-peche (long)</button><button class="quiz-btn" onclick="quiz(this,3,3)">c) 123456789</button></div>`},
{id:"c5",name:"C5 · WiFi & WPA2",html:`
<h3>Le WiFi : handshake et crack</h3>
<p>Quand un client se connecte en WPA2, un <b>handshake</b> (poignée de main en 4 messages) est échangé. En capturant ce handshake, on peut tester des mots de passe hors ligne :</p>
<pre>sudo airmon-ng start wlan0          # mode moniteur
sudo airodump-ng wlan0mon           # scanner
sudo aireplay-ng --deauth 5 -a BSSID wlan0mon   # forcer une reconnexion
aircrack-ng -w rockyou.txt capture.cap</pre>
<p><b>Défense :</b> mot de passe long (16+), WPA3 si possible, désactiver le WPS.</p>
<div class="quiz"><b>Quiz :</b> pourquoi l'attaque "deauth" existe-t-elle ?<br>
<button class="quiz-btn" onclick="quiz(this,4,1)">a) Pour faire joli</button><button class="quiz-btn" onclick="quiz(this,4,2)">b) Forcer un client à se reconnecter et capturer le handshake</button><button class="quiz-btn" onclick="quiz(this,4,3)">c) Augmenter le signal</button></div>`},
{id:"c6",name:"C6 · Défense & Blue Team",html:`
<h3>Défendre son entreprise</h3>
<p>Le défenseur (Blue Team) lit les <b>logs</b> pour détecter une attaque, puis réagit :</p>
<pre>tail -f /var/log/auth.log              # qui tente de se connecter ?
ss -tulpn                              # quels ports sont ouverts ?
sudo ufw deny 23/tcp                   # fermer Telnet (dangereux)
sudo iptables -A INPUT -s 1.2.3.4 -j DROP   # bannir une IP attaquante</pre>
<p><b>Principes :</b> moindre privilège, mises à jour, mots de passe forts, surveillance continue, pas de services inutiles (Telnet, FTP anonyme).</p>
<div class="quiz"><b>Quiz :</b> quel service est à fermer en priorité ?<br>
<button class="quiz-btn" onclick="quiz(this,5,1)">a) HTTPS (443)</button><button class="quiz-btn" onclick="quiz(this,5,2)">b) Telnet (23)</button><button class="quiz-btn" onclick="quiz(this,5,3)">c) SSH (22) durci</button></div>`}
];

 else p("ls | get | bye","warn");}
function sshPw(v){const L=redLabs[S.curIdx];
 if(v===L.m.ssh.pass){S.mode=null;S.shell=true;S.user=L.m.ssh.user;S.host="lab-ssh";
  Object.assign(S.loot,L.m.ssh.home);
  p("Welcome to Ubuntu 20.04 LTS","dim");agent("Shell obtenu ! ls puis cat flag.txt","ok");}
 else{p("Permission denied, please try again.","err");S.mode=null;}}
function msfCmd(v){const L=redLabs[S.curIdx],t=v.trim().split(/\s+/);
 if(t[0]==="use")S.msfUse=t.slice(1).join(" ");
 else if(t[0]==="set"&&/RHOSTS/i.test(t[1]||"")){S.msfHost=t[2];p("RHOSTS => "+t[2]);}
 else if(t[0]==="run"||t[0]==="exploit"){
  if(!S.msfUse||!S.msfUse.includes("ms17"))return p("[-] Aucun module EternalBlue (use exploit/windows/smb/ms17_010_eternalblue)","err");
  if(S.msfHost!==L.m.ip)return agent("set RHOSTS "+L.m.ip,"warn");
  p("[*] Meterpreter session 1 opened","ok");S.root=true;S.shell=true;S.user="SYSTEM";S.host="win-legacy";
  S.loot["flag.txt"]="FLAG{ETERNAL_BLUE}";S.mode=null;}
 else if(t[0]==="exit"||t[0]==="background")S.mode=null;
 else p("use / set RHOSTS / run / exit","warn");}

/* ================= BOUCLE D'ENTRÉE TERMINAL ================= */
const hist=[];let hi=0;
inp.addEventListener("keydown",evt=>{
 if(evt.key==="ArrowUp"&&hist.length){hi=Math.max(0,hi-1);inp.value=hist[hi];evt.preventDefault();return;}
 if(evt.key==="ArrowDown"&&hist.length){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||"";evt.preventDefault();return;}
 if(evt.key!=="Enter")return;

 const v=inp.value;inp.value="";
 if(v.trim()){hist.push(v);hi=hist.length;}
 p($("prompt").textContent+(S.mode==="sshpw"?"****":v));
 const e=all[cur];
 if(e.type==="course")return;
 if(S.mode==="ftp")ftpCmd(v);
 else if(S.mode==="sshpw")sshPw(v);
 else if(S.mode==="msf")msfCmd(v);
 else{const t=tok(v);let n=t[0],a=t.slice(1);if(n==="sudo"){n=a[0];a=a.slice(1);}
  const fn=C[n];if(!fn){p(n+": commande introuvable","err");agent("Commande inconnue. Tape help.","warn");}else fn(a);}
 upPrompt();agentCheck(e.type==="red"?redLabs[e.idx].objectives:blueLabs[e.idx].objectives);
});
function upPrompt(){$("prompt").textContent=S.mode==="msf"?"msf6> ":S.mode==="ftp"?"ftp> ":S.mode==="sshpw"?"password: ":S.shell?S.user+"@"+S.host+"$ ":"(kali㉿kali)-["+S.cwd+"]$ ";}
document.addEventListener("click",ev=>{if(!ev.target.closest("button")&&!$("term").classList.contains("hidden"))inp.focus();});

/* ================= DÉMARRAGE ================= */
refreshMenu();
show(done("c1")?"c2":"c1");
</script>
