<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Administration Sécurisée | C.A</title>
<style>
:root{color-scheme:dark;--bg:#070a0e;--panel:#101822;--line:#24303a;--text:#eeebe3;--muted:#a7b0b8;--gold:#dcb96e;--ok:#6fd3a0;--bad:#ff8a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0)}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f6f4ef;--panel:#fff;--line:#d9d4c8;--text:#181b1f;--muted:#566069;--gold:#8a6514;--ok:#0f7a4d;--bad:#b3261e}}
*,*:before,*:after{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}
.w{width:min(1100px,92%);margin:auto;padding:24px 0 60px}h1,h2{font-family:Georgia,serif;margin:0}h2{font-size:22px;margin:28px 0 12px}
.btn,select,input,textarea{font:inherit;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px 12px}
.btn{background:var(--gold);color:#14110a;border-color:var(--gold);font-weight:600;cursor:pointer;transition:all .2s}.btn:hover{filter:brightness(1.1)}
.btn.g{background:none;color:var(--gold)}.btn.d{background:none;color:var(--bad);border-color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 24px}.card b{display:block;font-size:26px;color:var(--gold)}.card span{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}th{color:var(--muted);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row input{flex:1;min-width:140px}.done{text-decoration:line-through;color:var(--muted)}
.box-center{max-width:380px;margin:12vh auto}
.err{color:var(--bad);min-height:20px;font-size:13px;margin:8px 0}
.ok{color:var(--ok);min-height:20px;font-size:13px;margin:8px 0}
.link-btn{background:none;border:none;color:var(--gold);font-size:13px;padding:0;cursor:pointer;text-decoration:underline}
.link-btn:hover{filter:brightness(1.2)}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div class="w">

<!-- Formulaire de Connexion -->
<div id="login-box" class="card box-center">
  <h1>Administration</h1>
  <p style="color:var(--muted);font-size:13.5px;margin:6px 0 16px">Accès sécurisé réservé au propriétaire du site.</p>

  <label for="pw" style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px">Mot de passe administrateur :</label>
  <input id="pw" type="password" style="width:100%;margin-bottom:12px" placeholder="Entrez votre mot de passe" autocomplete="current-password" aria-label="Mot de passe">

  <div class="err" id="le" role="alert"></div>
  <button class="btn" id="lb" style="width:100%">Se connecter</button>

  <div style="margin-top:16px;text-align:center">
    <button class="link-btn" type="button" onclick="showReset(true)">Mot de passe oublié ?</button>
  </div>
</div>

<!-- Formulaire Réinitialisation / Mot de passe oublié -->
<div id="reset-box" class="card box-center" hidden>
  <h1>Réinitialisation</h1>
  <p style="color:var(--muted);font-size:13.5px;margin:6px 0 16px">Confirmez votre identité pour enregistrer un nouveau mot de passe administrateur.</p>

  <label for="rp-email" style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px">Adresse e-mail propriétaire :</label>
  <input id="rp-email" type="email" style="width:100%;margin-bottom:10px" placeholder="anarouachamsoudine010@gmail.com" autocomplete="email">

  <label for="rp-phone" style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px">Numéro de téléphone de vérification :</label>
  <input id="rp-phone" type="tel" style="width:100%;margin-bottom:10px" placeholder="+227 91 03 80 61" autocomplete="tel">

  <label for="rp-newpw" style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px">Nouveau mot de passe administrateur (min. 8 car.) :</label>
  <input id="rp-newpw" type="password" style="width:100%;margin-bottom:12px" placeholder="Nouveau mot de passe sécurisé">

  <div class="err" id="re-err" role="alert"></div>
  <div class="ok" id="re-ok" role="alert"></div>

  <button class="btn" id="rb" style="width:100%;margin-bottom:10px">Enregistrer le nouveau mot de passe</button>
  <div style="text-align:center">
    <button class="link-btn" type="button" onclick="showReset(false)">← Retour à la connexion</button>
  </div>
</div>

<!-- Tableau de Bord Admin -->
<div id="app" hidden>
  <div class="top">
    <h1>Tableau de bord</h1>
    <div class="row" style="margin:0">
      <button class="btn g" id="rf">Actualiser</button>
      <button class="btn g" id="ex">Exporter CSV</button>
      <button class="btn g" id="lo">Déconnexion</button>
    </div>
  </div>
  <div class="stats" id="st"></div>
  <div class="err" id="ae" role="alert"></div>

  <h2>Tâches</h2>
  <form class="row" id="tf">
    <input id="tt" placeholder="Nouvelle tâche (ex : rappeler un contact)" maxlength="200" required>
    <input id="td" type="date" aria-label="Échéance">
    <select id="tl" aria-label="Inscrit lié"><option value="">Aucun inscrit</option></select>
    <button class="btn">Ajouter</button>
  </form>
  <div class="scroll"><table id="tb"></table></div>

  <h2>Inscriptions & Utilisateurs</h2>
  <div class="row">
    <input id="q" placeholder="Rechercher nom, e-mail, organisation…">
    <select id="sf"><option value="">Tous statuts</option></select>
  </div>
  <div class="scroll"><table id="lt"></table></div>
</div>

</div>

<script>
const $=s=>document.querySelector(s),ST=[["nouveau","Nouveau"],["contacte","Contacté"],["qualifie","Qualifié"],["archive","Archivé"]];let D={leads:[],tasks:[]};
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(a,x={}){
  const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:a,...x})});
  let j={};try{j=await r.json()}catch{}
  if(r.status===401&&a!=="login"){show(false);throw new Error("session")}
  if(!r.ok)throw Object.assign(new Error(j.message||j.error||"erreur"),{code:j.error,message:j.message});
  return j;
}

function show(v){
  $("#login-box").hidden=v;
  $("#reset-box").hidden=true;
  $("#app").hidden=!v;
}

function showReset(v){
  $("#login-box").hidden=v;
  $("#reset-box").hidden=!v;
  $("#le").textContent="";
  $("#re-err").textContent="";
  $("#re-ok").textContent="";
}

const msg={
  admin_not_configured:"Admin non configuré sur le serveur.",
  bad_credentials:"Mot de passe incorrect.",
  rate_limited:"Trop de tentatives infructueuses. Accès suspendu temporairement (15 min).",
  db_not_configured:"Base de données non configurée.",
  db_error:"Erreur base de données."
};

async function load(){
  try{
    D=await api("list");
    $("#ae").textContent="";
    draw();
    show(true);
  }catch(x){
    if(x.message!=="session"){
      $("#ae").textContent=x.message||msg[x.code]||"Erreur de chargement.";
      show(x.code&&x.code!=="unauthorized");
    }
  }
}

function draw(){
  const L=D.leads,T=D.tasks,od=T.filter(t=>!t.done&&t.due&&t.due<new Date().toISOString().slice(0,10)).length;
  $("#st").innerHTML=[["Inscrits",L.length],["Nouveaux",L.filter(l=>l.status==="nouveau").length],["Tâches ouvertes",T.filter(t=>!t.done).length],["En retard",od]].map(([a,b])=>`<div class="card"><b>${b}</b><span>${a}</span></div>`).join("");
  $("#tl").innerHTML='<option value="">Aucun inscrit</option>'+L.map(l=>`<option value="${l.id}">${e(l.name)}</option>`).join("");
  const nm=id=>(L.find(l=>l.id===id)||{}).name||"";
  $("#tb").innerHTML="<tr><th></th><th>Tâche</th><th>Échéance</th><th>Inscrit</th><th></th></tr>"+(T.map(t=>`<tr><td><input type="checkbox" data-tg="${t.id}" ${t.done?"checked":""} aria-label="Terminée"></td><td class="${t.done?"done":""}">${e(t.title)}</td><td>${e(t.due||"—")}</td><td>${e(nm(t.lead_id))}</td><td><button class="btn d" data-td="${t.id}">Suppr.</button></td></tr>`).join("")||'<tr><td colspan="5" style="color:var(--muted)">Aucune tâche.</td></tr>');
  const q=$("#q").value.toLowerCase(),sf=$("#sf").value,F=L.filter(l=>(!sf||l.status===sf)&&(!q||[l.name,l.email,l.organization,l.phone].join(" ").toLowerCase().includes(q)));
  $("#lt").innerHTML="<tr><th>Date</th><th>Contact</th><th>Statut</th><th>Notes</th><th></th></tr>"+(F.map(l=>`<tr><td>${e(new Date(l.created_at).toLocaleDateString("fr-FR"))}</td><td><b>${e(l.name)}</b><br><a href="mailto:${e(l.email)}" style="color:var(--gold)">${e(l.email)}</a><br>${e(l.phone||"")} ${e(l.organization||"")}</td><td><select data-st="${l.id}">${ST.map(([v,n])=>`<option value="${v}" ${l.status===v?"selected":""}>${n}</option>`).join("")}</select></td><td><textarea data-nt="${l.id}" rows="2" maxlength="2000" style="width:100%;min-width:160px">${e(l.notes)}</textarea></td><td><button class="btn d" data-ld="${l.id}">Suppr.</button></td></tr>`).join("")||'<tr><td colspan="5" style="color:var(--muted)">Aucun inscrit.</td></tr>');
}

async function run(f){
  try{await f();await load()}catch(x){if(x.message!=="session")$("#ae").textContent="Action impossible : "+(x.message||msg[x.code]||x.message)}
}

$("#sf").innerHTML+=ST.map(([v,n])=>`<option value="${v}">${n}</option>`).join("");

// Connexion
$("#lb").onclick=async()=>{
  $("#le").textContent="";
  try{
    await api("login",{password:$("#pw").value});
    $("#pw").value="";
    load();
  }catch(x){
    $("#le").textContent=x.message||msg[x.code]||"Connexion impossible.";
  }
};
$("#pw").onkeydown=x=>{if(x.key==="Enter")$("#lb").click()};

// Réinitialisation mot de passe
$("#rb").onclick=async()=>{
  $("#re-err").textContent="";
  $("#re-ok").textContent="";
  const email=$("#rp-email").value.trim();
  const phone=$("#rp-phone").value.trim();
  const new_password=$("#rp-newpw").value.trim();

  if(!email||!phone||!new_password){
    $("#re-err").textContent="Veuillez remplir tous les champs.";
    return;
  }
  if(new_password.length<8){
    $("#re-err").textContent="Le mot de passe doit comporter au moins 8 caractères.";
    return;
  }

  try{
    const res=await api("reset_password",{email,phone,new_password});
    $("#re-ok").textContent=res.message||"Mot de passe mis à jour ! Vous pouvez vous connecter.";
    $("#rp-newpw").value="";
    setTimeout(()=>{
      showReset(false);
      $("#le").textContent="Nouveau mot de passe actif. Connectez-vous.";
    },1800);
  }catch(x){
    $("#re-err").textContent=x.message||"Échec de la réinitialisation. Vérifiez vos coordonnées.";
  }
};

$("#rf").onclick=load;
$("#q").oninput=draw;
$("#sf").onchange=draw;
$("#lo").onclick=async()=>{await api("logout").catch(()=>{});show(false)};

$("#tf").onsubmit=x=>{x.preventDefault();run(async()=>{await api("task_add",{title:$("#tt").value,due:$("#td").value,lead_id:$("#tl").value});$("#tf").reset()})};
document.addEventListener("change",x=>{const t=x.target;if(t.dataset.tg)run(()=>api("task_toggle",{id:t.dataset.tg,done:t.checked}));if(t.dataset.st)run(()=>api("lead_update",{id:t.dataset.st,status:t.value}));if(t.dataset.nt)run(()=>api("lead_update",{id:t.dataset.nt,notes:t.value}))});
document.addEventListener("click",x=>{const t=x.target;if(t.dataset.td&&confirm("Supprimer cette tâche ?"))run(()=>api("task_delete",{id:t.dataset.td}));if(t.dataset.ld&&confirm("Supprimer cet inscrit ?"))run(()=>api("lead_delete",{id:t.dataset.ld}))});
$("#ex").onclick=()=>{const c=v=>`"${String(v??"").replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")}"`,r=[["date","nom","email","telephone","organisation","statut","notes"],...D.leads.map(l=>[l.created_at,l.name,l.email,l.phone,l.organization,l.status,l.notes])];
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+r.map(x=>x.map(c).join(",")).join("\n")],{type:"text/csv"}));a.download="inscrits.csv";a.click()};

load();
</script></body></html>
