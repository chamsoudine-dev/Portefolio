<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="45%" stop-color="#dcb96e"/>
      <stop offset="100%" stop-color="#a07a2c"/>
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Symbole de gauche -->
  <g transform="translate(6, 6)">
    <!-- Fond écusson -->
    <rect width="68" height="68" rx="16" fill="#090e16" stroke="url(#logoGold)" stroke-width="1.8"/>
    <!-- Bouclier Hexagonal -->
    <polygon points="34,8 58,18 58,45 34,62 10,45 10,18" fill="rgba(16,24,36,0.95)" stroke="url(#logoGold)" stroke-width="2.2" filter="url(#logoGlow)"/>
    <!-- Circuit Cyan -->
    <polygon points="34,13 52,21 52,42 34,55 16,42 16,21" fill="none" stroke="url(#logoCyan)" stroke-width="1" opacity="0.6"/>
    <!-- A Stylisé -->
    <path d="M 34,15 L 49,50 L 41,50 L 34,31 L 27,50 L 19,50 Z" fill="url(#logoGold)"/>
    <!-- Nœud Cyan -->
    <rect x="25" y="37" width="18" height="3" rx="1.5" fill="url(#logoCyan)"/>
    <circle cx="34" cy="38.5" r="2.2" fill="#fff" filter="url(#logoGlow)"/>
  </g>

  <!-- Typographie ANATEC -->
  <text x="88" y="44" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="1.5" fill="#f0f4f8">
    ANA<tspan fill="url(#logoGold)">TEC</tspan>
  </text>

  <!-- Sous-titre Academy & Labs -->
  <text x="89" y="60" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" font-weight="600" letter-spacing="2.2" fill="url(#logoCyan)">
    ÉCOLE DU NUMÉRIQUE · LABS
  </text>
</svg>